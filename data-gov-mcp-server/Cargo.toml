[package]
rust-version = "1.90"
name = "data-gov-mcp-server"
version = "0.5.0"
edition = "2024"

description = "MCP Server for AI integration with Data.Gov"
license = "Apache-2.0"
repository = "https://github.com/dspadea/data-gov-rs"
keywords = ["data", "government", "catalog", "mcp", "ai"]
categories = []
authors = ["David Spadea"]
homepage = "https://github.com/dspadea/data-gov-rs"


[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
data-gov = { version = "0.5.0", path = "../data-gov", default-features = false }

[dev-dependencies]
wiremock = "0.6"

[features]
default = ["native-tls"]
native-tls = ["data-gov/native-tls"]
rustls-tls = ["data-gov/rustls-tls"]

[lints]
workspace = true
