[workspace]

resolver = "3"

members = [
"data-gov-ckan",
"data-gov-catalog",
"data-gov",
"data-gov-mcp-server"
]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[patch.crates-io]
data-gov = { path = "data-gov" }
data-gov-ckan = { path = "data-gov-ckan" }
data-gov-catalog = { path = "data-gov-catalog" }
