[package]
rust-version = "1.90"
name = "data-gov"
version = "0.5.0"
edition = "2024"
description = "Rust client library and CLI for data.gov - search, explore, and download U.S. government datasets"
license = "Apache-2.0"
repository = "https://github.com/dspadea/data-gov-rs"
keywords = ["data", "government", "api", "catalog", "cli"]
categories = ["api-bindings", "command-line-utilities", "web-programming"]
authors = ["David Spadea"]
homepage = "https://github.com/dspadea/data-gov-rs"

[[bin]]
name = "data-gov"
path = "tools/cli/main.rs"

[dependencies]
data-gov-catalog = { version = "0.5.0", path = "../data-gov-catalog", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "stream"] }
tokio = { version = "1.47.1", features = ["full"] }
# REPL and CLI dependencies
rustyline = "17.0.2"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0.0"
is-terminal = "0.4"
# File I/O and async
futures = "0.3"
# Error handling
thiserror = "2.0"
# Progress bars and user experience
indicatif = { version = "0.18.1", features = ["tokio"] }
# URL parsing
url = "2.5"
# Cross-platform directories
dirs = "6.0"
# Library diagnostics (src/client.rs, src/config.rs). A library linked into
# somebody else's program must not write to their terminal: a bare stderr line
# cannot be routed, levelled or silenced by the embedder, and is lost outright
# to one that collects `tracing`. This is the facade only - no subscriber - so
# a consumer that installs none pays nothing. Already in the lockfile at the
# same version through data-gov-mcp-server, so it adds no new transitive
# dependency.
tracing = "0.1"
# Configuration file (src/config/file.rs). The standard library has no TOML
# parser and no derive-based deserialization, and config.toml is a data shape
# with a known key set that CLAUDE.md requires be modelled as a struct rather
# than a map. Versions confirmed current via `cargo info` against the live
# crates.io index, and scanned against OSV before the first build.
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
tempfile = "3"
# Process-level CLI tests (tests/cli_process_tests.rs): drives the real
# built binary with argv, separated stdio, and an observed exit code —
# nothing else in this crate's dev-dependencies can do that. Versions
# confirmed current via `cargo info` against the live crates.io index.
assert_cmd = "2.2.2"
predicates = "3.1.4"

[features]
default = ["native-tls"]
native-tls = ["data-gov-catalog/native-tls", "reqwest/native-tls"]
rustls-tls = ["data-gov-catalog/rustls-tls", "reqwest/rustls"]

[lints]
workspace = true
