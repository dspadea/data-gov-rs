name: CI

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - 1.90.0  # MSRV
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    # CI runs the same recipes a developer runs, so `just check` locally and a
    # green pipeline cannot drift apart.
    - name: Install just
      uses: extractions/setup-just@v4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: just fmt-check
      if: matrix.rust == 'stable'

    - name: Check the working docs are plain ASCII
      run: just check-ascii
      if: matrix.rust == 'stable'

    - name: Check for a newly introduced absolute home path
      run: just check-home-paths
      if: matrix.rust == 'stable'

    - name: Check for bare print macros in the CLI and the library crates
      run: just check-print-macros
      if: matrix.rust == 'stable'

    # The release helpers decide whether an irreversible `cargo publish` runs.
    # Testing them here, against a stub index, is the only place the 500 and
    # the refused-connection paths get exercised before a tag depends on them.
    - name: Check the crates.io release helpers
      run: just check-release-helpers
      if: matrix.rust == 'stable'

    - name: Check for unused dependencies
      run: just check-deps
      if: matrix.rust == 'stable'

    - name: Run clippy
      run: just lint
      if: matrix.rust == 'stable'

    - name: Build
      run: just build

    # --workspace covers unit tests, every tests/ integration target, and doc
    # tests. Selecting --lib here would silently skip both binary crates and
    # every tests/ target: 37 of 181 tests would run.
    - name: Run tests
      run: just test

    # --all-features enables native-tls and rustls at once, a combination no
    # consumer selects, and so never compiles the rustls-only build that
    # consumers do select. Without this step a missing import or a cfg typo
    # behind rustls-tls reaches a release unnoticed.
    - name: Build the rustls-only configuration
      run: just check-rustls

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-examples-${{ hashFiles('**/Cargo.lock') }}

    # Examples make real API calls, so they are compiled but not run.
    - name: Build examples
      run: just examples

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

    - name: Build documentation
      run: just docs

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run cargo audit (RustSec advisory database)
      run: cargo audit

    # cargo audit only consults the RustSec database. Seven openssl advisories
    # (five High) were GHSA-only and invisible to it; OSV.dev aggregates both,
    # so this step is not redundant with the one above.
    #
    # The action lives in a subdirectory: the repository root action.yml carries
    # only branding metadata and has no `runs:` block, so referencing the repo
    # root fails at job setup. Pin the exact patch version — upstream notes the
    # scanner action's behaviour may change within a minor release.
    - name: Scan lockfile against OSV (catches GHSA-only advisories)
      uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
      with:
        scan-args: |-
          --lockfile=./Cargo.lock

  live-api:
    name: Live API Tests
    # Hits the real data.gov Catalog API, so it is opt-in rather than gating:
    # a data.gov outage must not turn PRs red. Run it from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install just
      uses: extractions/setup-just@v4

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-live-${{ hashFiles('**/Cargo.lock') }}

    - name: Run ignored (network) tests
      run: just test-live
      env:
        RUST_LOG: debug
